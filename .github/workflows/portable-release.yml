name: Portable Linux release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build in a glibc 2.17 environment
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            quay.io/pypa/manylinux2014_x86_64 bash -lc '
              /opt/python/cp312-cp312/bin/pip install cmake ninja &&
              /opt/python/cp312-cp312/bin/cmake -S . -B build/portable -G Ninja \
                -DCMAKE_BUILD_TYPE=Release -DBUILD_DOCS=OFF \
                -DENABLE_PY_BINDINGS=OFF -DPYBIND11_NOPYTHON=ON \
                -DCMAKE_CXX_FLAGS="-static-libstdc++ -static-libgcc" \
                -DCMAKE_INSTALL_PREFIX=/work/dist/root &&
              /opt/python/cp312-cp312/bin/cmake --build build/portable --parallel 2 &&
              /opt/python/cp312-cp312/bin/cmake --install build/portable
            '

      - name: Package and checksum
        run: |
          tar -C dist/root -czf dist/slang-netlist-linux-x86_64.tar.gz .
          sha256sum dist/slang-netlist-linux-x86_64.tar.gz > \
            dist/slang-netlist-linux-x86_64.tar.gz.sha256

      - name: Smoke test on Rocky Linux 8
        run: |
          docker run --rm -v "$PWD/dist/root:/opt/slang-netlist:ro" \
            rockylinux:8 /opt/slang-netlist/bin/slang-netlist --version

      - uses: actions/upload-artifact@v4
        with:
          name: slang-netlist-linux-x86_64
          path: |
            dist/slang-netlist-linux-x86_64.tar.gz
            dist/slang-netlist-linux-x86_64.tar.gz.sha256
